name: sop-os-mvp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sop_os
      POSTGRES_USER: sop_os
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sop_os_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sop_os -d sop_os"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.tools
    environment:
      DATABASE_URL: postgresql://sop_os:${POSTGRES_PASSWORD:-sop_os_dev}@postgres:5432/sop_os
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      NODE_ENV: development
      API_PORT: 3001
      DATABASE_URL: postgresql://sop_os:${POSTGRES_PASSWORD:-sop_os_dev}@postgres:5432/sop_os
      APP_ORIGIN: http://localhost:3000
      AUTH_MODE: development
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: sop-os-documents
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://sop_os:${POSTGRES_PASSWORD:-sop_os_dev}@postgres:5432/sop_os
      OUTBOX_POLL_INTERVAL_MS: 2000
      OUTBOX_PROVIDER: development-console
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_ORIGIN: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
