name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sop_os
          POSTGRES_USER: sop_os
          POSTGRES_PASSWORD: sop_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sop_os -d sop_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://sop_os:sop_os_ci@localhost:5432/sop_os
      APP_ORIGIN: http://localhost:3000
      AUTH_MODE: development
      OUTBOX_PROVIDER: development-console
      OUTBOX_POLL_INTERVAL_MS: 250
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:guard
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: API and outbox smoke test
        run: |
          pnpm --filter @sop-os/api start &
          api_pid=$!
          pnpm --filter @sop-os/worker start &
          worker_pid=$!
          trap 'kill "$api_pid" "$worker_pid" 2>/dev/null || true' EXIT
          pnpm smoke
          pnpm outbox:smoke

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
